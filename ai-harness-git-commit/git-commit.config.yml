# ai-harness-git-commit 設定ファイル（有効化時に自動生成された雛形）。
# 既定は規約なし＝コミットメッセージを一切チェックしません。
# 規約を課すには下記を実プロジェクトの方針に合わせて編集してください。
rule:
  title:
    # タイトル先頭に必須のタグ（<tag>: / <tag>(scope): 形式）。空＝タグ不問。
    tags: []
    # length: 50            # タイトルの最大文字数（省略＝無制限）
  # タイトル／本文に含めてはいけない文字列（空＝制限なし）。
  deny_word: []
  # injection: "..."        # 違反時に Claude へ返す指示プロンプト
