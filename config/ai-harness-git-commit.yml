# ai-harness-git-commit 設定ファイル
# 配置先: <実行体ディレクトリ>/config/ai-harness-git-commit.yml
# PreToolUse で git commit を捕捉し、rule に従わないメッセージを reject（deny）する。

rule:
  # タイトル（最初の -m の値）の規約
  title:
    # 使用可能なタグ。タイトルは "<tag>:" または "<tag>(scope):" で始まる必要がある。
    tags:
      - feat
      - chor
    # タイトルの最大文字数
    length: 50
  # 内容の制限（プレースホルダ。現状未使用）
  contents:
  # 使用不可能な文字列（タイトル/本文の両方を検査）
  deny_word:
    - pass
    - failed
  # 違反した場合に reason として Claude へ返す指示プロンプト
  injection: "以下要件に従ってコミットメッセージを作成してください。タイトルは許可タグ（feat / chor）で始め、50 文字以内。pass / failed の語は使用しないこと。"
